name: Continuous Integration Docker
on:
  push:
    branches: [main]
jobs:
  buld:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup-python
        uses: actions/setup-python@v5
        with:
            python-version: '3.12'
      - name: Install Ruff
        run: pip install ruff

      - name: Run Lint
        run: ruff check . --fix
        
      - name: Log in to Docker Hub
        env:
          registry: docker.io
          DOCKER_USER: mdhameeduddin
          DOCKER_PASS: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          docker logout
          printf "%s" "$DOCKER_PASS" | docker login -u "$DOCKER_USER" --password-stdin

          
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./.github/workflows
          file: ./.github/workflows/Dockerfile
          push: true
          tags: mdhameeduddin/github-actions-practice:latest
          
      - name: Pull Docker Image
        run: docker pull mdhameeduddin/github-actions-practice:latest

      - name: Run Docker Container
        run: |
           docker run -d \
              --name employee-app \
              -p 5000:5000 \
              mdhameeduddin/github-actions-practice:latest

      - name: Test Application
        run: |
           sleep 5
            curl --fail http://localhost:5000/
            curl --fail http://localhost:5000/employees
            curl --fail http://localhost:5000/employees/1
          

        
        
      
