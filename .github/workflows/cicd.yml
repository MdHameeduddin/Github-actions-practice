name: CI CD Pipeline
on:
  workflow_dispatch:
jobs:
    code:
      runs-on: ubuntu-latest
      steps:
        - name: Write Code
          run: echo " Writhing Code"
    build:
        needs: [code]
        runs-on: ubuntu-latest
        steps:
          - name: Build application
            run: echo "Building Application"
    test:
        needs: [build]
        runs-on: ubuntu-latest
        steps:
          - name: test application
            run: echo "Perform Unit and integration testing"
    deploy:
        needs: [test]
        runs-on: ubuntu-latest
        steps:
          - name: Deploy the application
            run: echo "Successfully Deployed"   
            
          - name: Create Build File
            run: echo "Employee Application Build" > employee.txt

          - name: Upload Artifact
            uses: actions/upload-artifact@v4
            with:
               name: Employee-Build
               path: employee.txt
            
